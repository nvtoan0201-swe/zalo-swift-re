[package]
name = "olaz-main"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
olaz-core.workspace = true
olaz-host = { path = "../olaz-host" }
serde_json.workspace = true
base64.workspace = true
futures = "0.3"
libc = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
nix = { version = "0.29", features = ["feature"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
oo7 = { version = "0.7", default-features = false, features = ["tokio", "native_crypto"] }
arboard = { version = "3", features = ["wayland-data-control"] }

[dev-dependencies]
tempfile = "3"
