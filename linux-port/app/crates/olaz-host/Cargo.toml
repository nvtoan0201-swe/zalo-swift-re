[package]
name = "olaz-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
olaz-core.workspace = true
olaz-ipc.workspace = true
serde_json.workspace = true
base64.workspace = true
futures = "0.3"
libc = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
percent-encoding.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip", "brotli", "deflate", "cookies"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"
