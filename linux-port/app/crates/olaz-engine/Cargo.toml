[package]
name = "olaz-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
regex = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
olaz-core.workspace = true
olaz-ipc.workspace = true
olaz-host = { path = "../olaz-host" }
olaz-main = { path = "../olaz-main" }
olaz-runtime = { path = "../olaz-runtime" }
olaz-media = { path = "../olaz-media" }
serde_json.workspace = true
base64.workspace = true
futures = "0.3"
url = "2"
unicode-normalization = "0.1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
