[package]
name = "olaz-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
olaz-core.workspace = true
olaz-engine = { path = "../olaz-engine" }
olaz-media = { path = "../olaz-media" }
olaz-runtime = { path = "../olaz-runtime" }
olaz-main = { path = "../olaz-main" }
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui-component = "0.9.0"
gpui-kit-assets = "0.9"
emojis = "0.6"
serde_json.workspace = true
futures = "0.3"
rust-embed = "8"
anyhow = "1"
chrono = "0.4"
url = "2"
linkify = "0.10"
unicode-segmentation = "1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
jxl-oxide = "0.12"
smallvec = "1"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
tempfile = "3"
