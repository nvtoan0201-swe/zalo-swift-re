[package]
name = "olaz-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
olaz-core.workspace = true
olaz-host = { path = "../olaz-host" }
futures = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "gzip"] }

olaz-main = { path = "../olaz-main" }
serde_json.workspace = true
base64.workspace = true
aes = "0.8"
ctr = "0.9"
ghash = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
jxl-oxide = "0.12"
libloading = "0.8"

[dev-dependencies]
aes-gcm = "0.10"
tempfile = "3"
